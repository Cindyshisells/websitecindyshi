<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#101c19">
  <meta name="description" content="Cindy Shi. A new chapter begins.">
  <title>Are you ready? | Cindy Shi</title>
  <style>
    * { box-sizing: border-box; }
    html { min-height: 100%; background: #101c19; }
    body { margin: 0; min-height: 100svh; color: #f6f0e5; font-family: Arial, sans-serif; background: radial-gradient(ellipse at 50% 40%, #263e33 0%, #15251f 45%, #101c19 80%); }
    .opening { min-height: 100svh; padding: 38px 24px 26px; display: flex; flex-direction: column; align-items: center; text-align: center; overflow: hidden; position: relative; }
    .opening::before { content: ''; position: absolute; inset: 16px; border: 1px solid #c6a66b38; pointer-events: none; }
    .brand { font-family: Georgia, serif; font-size: 25px; letter-spacing: 5px; text-transform: uppercase; }
    .brand small { display: block; font-family: Arial, sans-serif; font-size: 9px; letter-spacing: 3px; margin-top: 10px; color: #c6ad80; }
    main { margin: auto 0; padding: 60px 0; position: relative; width: min(100%, 760px); }
    .eyebrow { color: #cfb989; font-size: 10px; letter-spacing: 4px; text-transform: uppercase; margin: 0 0 30px; }
    .ornament { width: 1px; height: 58px; background: linear-gradient(transparent, #c6a66b); margin: 0 auto 30px; }
    h1 { font-family: Georgia, 'Times New Roman', serif; font-weight: 400; font-size: clamp(64px, 11vw, 122px); line-height: 1.04; letter-spacing: -3px; margin: 0 0 25px; }
    h1 em { font-weight: 400; color: #d8bf8d; }
    .subtitle { color: #d0d6cf; font-family: Georgia, serif; font-size: clamp(18px, 3vw, 22px); line-height: 1.6; margin: 0 auto 42px; max-width: 440px; }
    .love-note { color: #d8bf8d; font-family: Georgia, serif; font-size: 22px; margin: -20px 0 36px; }
    .countdown { display: flex; justify-content: center; gap: clamp(18px, 5vw, 42px); margin: 0 0 25px; }
    .countdown div { min-width: 58px; }
    .countdown strong { display: block; font-family: Georgia, serif; font-weight: 400; font-size: clamp(38px, 8vw, 58px); color: #d8bf8d; font-variant-numeric: tabular-nums; }
    .countdown span { display: block; margin-top: 10px; font-size: 9px; letter-spacing: 2px; color: #d0d6cf; text-transform: uppercase; }
    .release { font-size: 10px; letter-spacing: 1.5px; line-height: 1.8; color: #a8b4a9; }
    footer { color: #a8b4a9; font-size: 9px; letter-spacing: 3px; text-transform: uppercase; line-height: 1.8; }
    main { animation: arrive 1s ease-out both; }
    @keyframes arrive { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
    @media (max-width: 480px) { .opening { padding: 36px 26px 28px; } h1 { letter-spacing: -2px; } .eyebrow { letter-spacing: 2.5px; } main { padding: 48px 0; } }
    @media (prefers-reduced-motion: reduce) { main { animation: none; } .enter { transition: none; } }
  </style>
</head>
<body>
  <div class="opening">
    <header class="brand">Cindy Shi<small>Real Estate</small></header>
    <main>
      <div class="ornament" aria-hidden="true"></div>
      <p class="eyebrow">A new chapter begins</p>
      <h1>Are you<br><em>ready?</em></h1>
      <p class="subtitle">Something special is waiting for you.<br>The reveal is almost here.</p>
      <p class="love-note">I love you <span aria-label="heart">&#10084;&#65039;</span></p>
      <div class="countdown" role="timer" aria-label="Time until the website reveal" aria-live="off">
        <div><strong id="hours">--</strong><span>Hours</span></div>
        <div><strong id="minutes">--</strong><span>Minutes</span></div>
        <div><strong id="seconds">--</strong><span>Seconds</span></div>
      </div>
      <p class="release">The door opens October 12 at 11:59 PM.<br>Toronto time</p>
      <noscript><p class="release">Please enable JavaScript to see the countdown and the reveal.</p></noscript>
    </main>
    <footer>Toronto &amp; Greater Toronto Area</footer>
  </div>
<script>
    // Toronto is UTC-04:00 on October 12, 2026. All visitors share one release instant.
    const releaseAt = Date.parse('2026-10-12T23:59:00-04:00');
    function updateCountdown() {
      const remaining = Math.max(0, Math.ceil((releaseAt - Date.now()) / 1000));
      if (remaining === 0) {
        window.location.replace('2index.html');
        return;
      }
      document.getElementById('hours').textContent = String(Math.floor(remaining / 3600)).padStart(2, '0');
      document.getElementById('minutes').textContent = String(Math.floor(remaining / 60) % 60).padStart(2, '0');
      document.getElementById('seconds').textContent = String(remaining % 60).padStart(2, '0');
    }
    updateCountdown();
    setInterval(updateCountdown, 1000);
    document.addEventListener('visibilitychange', updateCountdown);
  </script>
</body>
</html>
